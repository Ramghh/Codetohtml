<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>محرر HTML المتكامل | حفظ تلقائي + تنسيق + فتح ملف + مشاركة</title>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- CodeMirror -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/default.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
    <!-- Screenfull.js لملء الشاشة -->
    <script src="https://cdn.jsdelivr.net/npm/screenfull@5.2.0/dist/screenfull.min.js"></script>
    <style>
        * { font-family: 'Inter', system-ui, sans-serif; }
        body { transition: background-color 0.25s ease, color 0.2s ease; }
        body.dark { background-color: #0f172a; color: #e2e8f0; }
        body.dark .bg-white { background-color: #1e293b !important; }
        body.dark .bg-gray-50 { background-color: #0f172a !important; }
        body.dark .border-gray-200 { border-color: #334155 !important; }
        body.dark .text-gray-700 { color: #cbd5e1 !important; }
        body.dark .bg-gray-100 { background-color: #1e293b !important; }
        body.dark input, body.dark button.secondary { background-color: #334155; color: #f1f5f9; border-color: #475569; }
        #previewFrame { background: white; width: 100%; height: 100%; border: none; border-radius: 12px; }
        .CodeMirror { height: 100%; min-height: 450px; font-size: 14px; border-radius: 16px; font-family: monospace; }
        body.dark .CodeMirror { background-color: #1a1f2e; }
        .btn-icon { transition: all 0.2s; }
        .btn-icon:hover { transform: translateY(-2px); filter: brightness(0.95); }
        .status-bar { font-size: 12px; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #10b981; color: white; padding: 8px 16px; border-radius: 40px; z-index: 100; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        body.dark .toast { background: #2dd4bf; color: #0f172a; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">

<div id="toastMessage" class="toast"></div>

<header class="bg-white/80 backdrop-blur-sm border-b border-gray-200 sticky top-0 z-10 shadow-sm">
    <div class="container mx-auto px-5 py-3 flex flex-wrap justify-between items-center gap-3">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-lg flex items-center justify-center shadow-md">
                <svg class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" /></svg>
            </div>
            <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">محرر HTML المتكامل</h1>
            <span class="hidden md:inline-block text-xs bg-gray-100 px-2 py-1 rounded-full">حفظ تلقائي · تنسيق · فتح ملف · مشاركة</span>
        </div>
        <div class="flex gap-2">
            <button id="darkModeToggle" class="w-10 h-10 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center">
                <svg id="darkIcon" class="h-5 w-5 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
            </button>
        </div>
    </div>
</header>

<main class="container mx-auto px-4 py-6 max-w-[1600px]">
    <div class="flex flex-col xl:flex-row gap-6">
        <!-- الجانب الأيسر: محرر + أزرار متقدمة -->
        <div class="flex-1 flex flex-col gap-3 min-w-0">
            <div class="bg-white rounded-2xl shadow-lg border overflow-hidden flex flex-col h-full">
                <div class="flex flex-wrap items-center justify-between gap-2 px-4 py-2 border-b bg-gray-50/50">
                    <div class="flex gap-1">
                        <span class="text-xs font-mono text-gray-500">✏️ محرر HTML</span>
                    </div>
                    <div class="flex gap-2 flex-wrap">
                        <button id="formatBtn" class="text-xs bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full hover:bg-indigo-200 transition">✨ تجميل</button>
                        <button id="uploadBtn" class="text-xs bg-green-100 text-green-700 px-3 py-1 rounded-full hover:bg-green-200 transition">📂 فتح ملف</button>
                        <input type="file" id="fileUploader" accept=".html,.htm" class="hidden" />
                        <button id="shareBtn" class="text-xs bg-amber-100 text-amber-700 px-3 py-1 rounded-full hover:bg-amber-200 transition">🔗 مشاركة</button>
                        <button id="fullscreenEditorBtn" class="text-xs bg-gray-200 text-gray-700 px-3 py-1 rounded-full hover:bg-gray-300 transition">🖥️ ملء المحرر</button>
                    </div>
                </div>
                <div class="p-2 flex-1">
                    <textarea id="htmlEditor" class="w-full h-full hidden"></textarea>
                </div>
                <div class="status-bar border-t p-2 flex justify-between text-gray-500 text-xs bg-gray-50">
                    <span id="stats">⬅️ أسطر: 0 | أحرف: 0</span>
                    <span>💾 حفظ تلقائي</span>
                </div>
            </div>
            <div class="flex flex-wrap gap-3 items-center justify-between">
                <div class="flex items-center gap-2">
                    <label class="text-sm font-medium">📄 اسم الملف:</label>
                    <input type="text" id="filename" value="index.html" class="border rounded-xl px-3 py-1 text-sm w-40">
                </div>
                <div class="flex gap-2">
                    <button id="downloadBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1.5 rounded-xl text-sm shadow flex items-center gap-1">⬇️ تحميل</button>
                    <button id="clearEditorBtn" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-1.5 rounded-xl text-sm">🗑️ مسح</button>
                </div>
            </div>
        </div>

        <!-- الجانب الأيمن: معاينة مع أزرار تحكم -->
        <div class="flex-1 flex flex-col gap-3">
            <div class="bg-white rounded-2xl shadow-lg border overflow-hidden flex flex-col h-full">
                <div class="flex justify-between items-center px-4 py-2 border-b bg-gray-50/50">
                    <span class="text-sm font-medium">🔍 معاينة مباشرة</span>
                    <button id="fullscreenPreviewBtn" class="text-xs bg-gray-200 px-3 py-1 rounded-full hover:bg-gray-300">🖥️ ملء المعاينة</button>
                </div>
                <div class="preview-panel p-2 bg-gray-100 flex-1" style="min-height: 500px;">
                    <iframe id="previewFrame" title="Live Preview" class="w-full h-full rounded-xl shadow-inner" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals"></iframe>
                </div>
                <div class="p-1 text-center text-xs text-gray-400">معاينة فورية (مع تأخير بسيط لتحسين الأداء)</div>
            </div>
        </div>
    </div>
</main>

<script>
    (function(){
        // --- عناصر DOM ---
        const textarea = document.getElementById('htmlEditor');
        const previewFrame = document.getElementById('previewFrame');
        const downloadBtn = document.getElementById('downloadBtn');
        const clearBtn = document.getElementById('clearEditorBtn');
        const formatBtn = document.getElementById('formatBtn');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileUploader = document.getElementById('fileUploader');
        const shareBtn = document.getElementById('shareBtn');
        const fullscreenEditorBtn = document.getElementById('fullscreenEditorBtn');
        const fullscreenPreviewBtn = document.getElementById('fullscreenPreviewBtn');
        const filenameInput = document.getElementById('filename');
        const darkModeToggle = document.getElementById('darkModeToggle');
        const statsSpan = document.getElementById('stats');

        // --- البيانات الأساسية ---
        let editor = null;
        let updateTimeout = null;
        const STORAGE_KEY = 'html_editor_content';
        const defaultHTML = `<!DOCTYPE html>
<html lang="ar">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>معاينة - محرر HTML</title>
<style>body{font-family:system-ui; background:#f5f7ff; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; padding:2rem;} .card{background:white; border-radius:2rem; padding:2rem; box-shadow:0 20px 35px -10px rgba(0,0,0,0.1); text-align:center;} button{background:#4f46e5; color:white; border:none; border-radius:2rem; padding:0.5rem 1.5rem;} </style>
</head>
<body><div class=\"card\"><h1>✨ المحرر المتكامل</h1><p>حفظ تلقائي، تنسيق، فتح ملف، مشاركة، ملء الشاشة.</p><button>ابدأ الآن</button></div></body></html>`;

        // --- تهيئة CodeMirror ---
        function initEditor(){
            editor = CodeMirror.fromTextArea(textarea, {
                mode: "htmlmixed",
                theme: "default",
                lineNumbers: true,
                lineWrapping: true,
                matchBrackets: true,
                autoCloseTags: true,
                autoCloseBrackets: true,
                indentUnit: 2,
                tabSize: 2
            });
            // استرجاع من localStorage
            const saved = localStorage.getItem(STORAGE_KEY);
            if(saved && saved.trim() !== ""){
                editor.setValue(saved);
            } else {
                editor.setValue(defaultHTML);
            }
            updatePreviewDebounced();
            updateStats();
            editor.on("change", () => {
                updatePreviewDebounced();
                updateStats();
                localStorage.setItem(STORAGE_KEY, editor.getValue());
                showToast("💾 تم الحفظ تلقائياً", 1200);
            });
        }

        // --- تحديث المعاينة مع debounce (تحسين الأداء) ---
        function updatePreviewNow(){
            let code = editor.getValue();
            if(!code.trim()){
                code = `<div style="font-family:sans-serif; text-align:center; padding:3rem; background:#f1f5f9; height:100vh;"><h2>📄 المحرر فارغ</h2><p>ألصق أو اكتب كود HTML في اللوحة اليسرى.</p></div>`;
            }
            const iframeDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            iframeDoc.open();
            iframeDoc.write(code);
            iframeDoc.close();
        }

        function updatePreviewDebounced(){
            if(updateTimeout) clearTimeout(updateTimeout);
            updateTimeout = setTimeout(() => {
                updatePreviewNow();
            }, 300);
        }

        // --- إحصائيات (أسطر + أحرف) ---
        function updateStats(){
            const content = editor.getValue();
            const lines = content.split(/\r?\n/).length;
            const chars = content.length;
            statsSpan.innerText = `📊 أسطر: ${lines} | أحرف: ${chars}`;
        }

        // --- تنسيق الكود (Prettify بسيط) ---
        function formatHTML(html){
            let formatted = '';
            let indent = 0;
            const tab = '  ';
            html = html.replace(/>\s*</g, '>\n<');
            const lines = html.split('\n');
            for(let line of lines){
                line = line.trim();
                if(line.match(/^<\/\w/)) indent = Math.max(0, indent-1);
                formatted += tab.repeat(indent) + line + '\n';
                if(line.match(/<\w[^>]*[^\/]>$/) && !line.match(/<\?(xml|php)/) && !line.match(/<!(DOCTYPE|--)/)) indent++;
            }
            return formatted;
        }

        function prettifyCode(){
            const raw = editor.getValue();
            const pretty = formatHTML(raw);
            editor.setValue(pretty);
            showToast("✨ تم تنسيق الكود", 1500);
        }

        // --- مشاركة الكود عبر الرابط (hash) ---
        function shareCode(){
            const code = editor.getValue();
            const encoded = encodeURIComponent(code);
            const newUrl = window.location.pathname + '#' + encoded;
            window.history.pushState({}, '', newUrl);
            navigator.clipboard.writeText(window.location.href);
            showToast("🔗 تم نسخ الرابط مع الكود المشفر", 2000);
        }

        // --- استعادة الكود من الرابط عند التحميل ---
        function loadFromHash(){
            if(window.location.hash && window.location.hash.length > 1){
                try{
                    const encoded = window.location.hash.substring(1);
                    const decoded = decodeURIComponent(encoded);
                    if(decoded && decoded.trim() !== ""){
                        editor.setValue(decoded);
                        localStorage.setItem(STORAGE_KEY, decoded);
                        showToast("📎 تم تحميل الكود من الرابط", 1500);
                    }
                } catch(e){}
            }
        }

        // --- فتح ملف محلي ---
        function openLocalFile(){
            fileUploader.click();
        }
        function handleFileUpload(e){
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(ev){
                editor.setValue(ev.target.result);
                localStorage.setItem(STORAGE_KEY, ev.target.result);
                showToast(`📂 تم فتح ${file.name}`, 1500);
            };
            reader.readAsText(file);
            fileUploader.value = '';
        }

        // --- تحميل الملف إلى الجهاز ---
        function downloadHTML(){
            let filename = filenameInput.value.trim();
            if(!filename) filename = "index.html";
            if(!filename.endsWith(".html") && !filename.endsWith(".htm")) filename += ".html";
            const blob = new Blob([editor.getValue()], {type: "text/html"});
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
            URL.revokeObjectURL(link.href);
            showToast("✅ تم تحميل الملف", 1200);
        }

        // --- مسح المحرر ---
        function clearEditor(){
            if(confirm("⚠️ هل أنت متأكد من مسح كل الكود؟")){
                editor.setValue("");
                showToast("🧹 تم مسح المحرر", 1200);
            }
        }

        // --- ملء الشاشة باستخدام screenfull ---
        function toggleFullscreen(element){
            if(screenfull.isEnabled){
                screenfull.toggle(element);
            }
        }

        // --- إشعارات علوية (toast) ---
        function showToast(msg, duration=1500){
            const toast = document.getElementById('toastMessage');
            toast.innerText = msg;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, duration);
        }

        // --- الوضع المظلم ---
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        let isDarkMode = localStorage.getItem('themeMode') === 'dark' || (localStorage.getItem('themeMode') === null && prefersDark);
        function applyDarkMode(enable){
            if(enable){
                document.body.classList.add('dark');
                editor.setOption('theme', 'dracula');
                document.getElementById('darkIcon').innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />`;
            } else {
                document.body.classList.remove('dark');
                editor.setOption('theme', 'default');
                document.getElementById('darkIcon').innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />`;
            }
            localStorage.setItem('themeMode', enable ? 'dark' : 'light');
        }
        
        // --- اختصارات لوحة المفاتيح ---
        function setupShortcuts(){
            window.addEventListener('keydown', (e) => {
                if(e.ctrlKey && e.shiftKey && e.key === 'F'){
                    e.preventDefault(); prettifyCode();
                }
                if(e.ctrlKey && e.shiftKey && e.key === 'U'){
                    e.preventDefault(); openLocalFile();
                }
                if(e.ctrlKey && e.shiftKey && e.key === 'S'){
                    e.preventDefault(); downloadHTML();
                }
                if(e.ctrlKey && e.shiftKey && e.key === 'E'){
                    e.preventDefault(); clearEditor();
                }
                if(e.ctrlKey && e.shiftKey && e.key === 'L'){
                    e.preventDefault(); toggleFullscreen(document.querySelector('.flex-1').parentElement.parentElement);
                }
            });
        }

        // --- ربط الأحداث ---
        function bindEvents(){
            downloadBtn.addEventListener('click', downloadHTML);
            clearBtn.addEventListener('click', clearEditor);
            formatBtn.addEventListener('click', prettifyCode);
            uploadBtn.addEventListener('click', openLocalFile);
            fileUploader.addEventListener('change', handleFileUpload);
            shareBtn.addEventListener('click', shareCode);
            fullscreenEditorBtn.addEventListener('click', () => toggleFullscreen(document.querySelector('.flex-1 .bg-white')));
            fullscreenPreviewBtn.addEventListener('click', () => toggleFullscreen(document.querySelector('.flex-1:last-child .bg-white')));
            darkModeToggle.addEventListener('click', () => applyDarkMode(!document.body.classList.contains('dark')));
            window.addEventListener('resize', () => editor.refresh());
        }

        // --- بدء التشغيل ---
        initEditor();
        bindEvents();
        setupShortcuts();
        applyDarkMode(isDarkMode);
        loadFromHash();  // استعادة من الرابط إن وجد
        updatePreviewNow();
    })();
</script>
</body>
</html>
